function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261124);

const spineNodes = nodes.filter(n => n.tier === "spine");
const branchNodes = nodes.filter(n => n.tier === "branch");
const dustNodes = nodes.filter(n => n.tier === "dust");

spineNodes.sort((a, b) =>
  (a.main_depth - b.main_depth) ||
  (b.in_degree - a.in_degree) ||
  ((a.start_line || 0) - (b.start_line || 0))
);

spineNodes.forEach((n, i) => {
  const t = spineNodes.length > 1 ? i / (spineNodes.length - 1) : 0;
  const y = -980 + t * 1960;
  const wave = Math.sin(t * Math.PI * 2.1 - 0.35) * 95 + Math.sin(t * Math.PI * 5.0) * 18;
  const jitter = (n.main_depth === 0) ? 0 : (rand() - 0.5) * 34;
  n.x = wave + jitter;
  n.y = y;
  n.r = n.main_depth === 0 ? 11 : Math.min(8.5, 3.6 + Math.sqrt(n.in_degree + 1) * 1.15);
});

const placed = new Set(spineNodes.map(n => n.id));
const neighborsOf = new Map(nodes.map(n => [n.id, []]));
edges.forEach(e => {
  neighborsOf.get(e.source).push(e.target);
  neighborsOf.get(e.target).push(e.source);
});

branchNodes.sort((a, b) => (a.main_depth - b.main_depth) || (b.in_degree - a.in_degree));
branchNodes.forEach((n, idx) => {
  const nbs = neighborsOf.get(n.id).filter(id => placed.has(id));
  let ay = -900 + rand() * 1800;
  let ax = 0;
  if (nbs.length > 0) {
    ay = nbs.reduce((s, id) => s + nodeMap.get(id).y, 0) / nbs.length;
    ax = nbs.reduce((s, id) => s + nodeMap.get(id).x, 0) / nbs.length;
  }
  const side = (idx % 2 === 0 ? 1 : -1);
  const depthSpread = 120 + Math.min(4, (n.main_depth || 2) - 1) * 115 + rand() * 210;
  const yJitter = (rand() - 0.42) * 260;
  n.x = ax + side * depthSpread;
  n.y = Math.max(-1040, Math.min(1060, ay + yJitter));
  n.r = n.kind === "python" ? 3.8 : 3.2;
  placed.add(n.id);
});

for (let iter = 0; iter < 18; iter++) {
  for (let i = 0; i < branchNodes.length; i++) {
    const a = branchNodes[i];
    for (let j = i + 1; j < branchNodes.length; j++) {
      const b = branchNodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy + 1;
      if (d2 < 2600) {
        const f = (2600 - d2) / 2600 * 3.2;
        const d = Math.sqrt(d2);
        a.x += (dx / d) * f; a.y += (dy / d) * f;
        b.x -= (dx / d) * f; b.y -= (dy / d) * f;
      }
    }
  }
}

dustNodes.forEach((n, idx) => {
  const angle = rand() * Math.PI * 2;
  const side = idx % 2 === 0 ? 1 : -1;
  const band = 260 + rand() * 580;
  n.x = side * band + Math.cos(angle) * 120;
  n.y = -1080 + rand() * 2160;
  n.r = 2.0 + rand() * 1.2;
});

function drawEdgeCurve(g, a, b, bend) {
  const mx = (a.x + b.x) * 0.5;
  const my = (a.y + b.y) * 0.5;
  const dx = b.x - a.x, dy = b.y - a.y;
  const cx = mx - dy * bend;
  const cy = my + dx * bend;
  g.beginPath();
  g.moveTo(a.x, a.y);
  g.quadraticCurveTo(cx, cy, b.x, b.y);
  g.stroke();
}

  g.save();
  g.globalCompositeOperation = "source-over";
  const bg = g.createRadialGradient(W * 0.5, H * 0.45, 40, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  bg.addColorStop(0, "#12081c");
  bg.addColorStop(0.45, "#090612");
  bg.addColorStop(1, "#040408");
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  g.translate(v.x, v.y);
  g.scale(v.scale, v.scale);

  if (showDust) {
    g.lineWidth = 1.0;
    g.strokeStyle = "rgba(110, 102, 138, 0.14)";
    for (const e of edges) {
      const a = nodeMap.get(e.source), b = nodeMap.get(e.target);
      if (a.tier === "dust" || b.tier === "dust") {
        drawEdgeCurve(g, a, b, 0.12);
      }
    }
    for (const n of dustNodes) {
      g.fillStyle = "rgba(128, 120, 155, 0.28)";
      g.beginPath();
      g.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      g.fill();
    }
  }

  g.globalCompositeOperation = "lighter";

  const activeSet = new Set();
  if (hovered) {
    activeSet.add(hovered.id);
    for (const nb of neighborsOf.get(hovered.id)) activeSet.add(nb);
  }

  for (const e of edges) {
    const a = nodeMap.get(e.source), b = nodeMap.get(e.target);
    if (a.tier === "dust" || b.tier === "dust") continue;
    const isSpineEdge = (a.tier === "spine" && b.tier === "spine");
    if (isSpineEdge) continue;
    const eqMatch = (mode === "all") || (a.in_equal_mass && b.in_equal_mass);
    const dim = (!eqMatch) || (hovered && !(activeSet.has(a.id) && activeSet.has(b.id)));
    const bend = ((a.x + b.y) % 2 === 0 ? 0.14 : -0.14);

    g.lineWidth = dim ? 1.0 : 4.2;
    g.strokeStyle = dim ? "rgba(120, 50, 190, 0.05)" : "rgba(162, 54, 255, 0.16)";
    drawEdgeCurve(g, a, b, bend);

    g.lineWidth = dim ? 0.6 : 1.35;
    g.strokeStyle = dim ? "rgba(155, 75, 220, 0.08)" : "rgba(218, 108, 255, 0.45)";
    drawEdgeCurve(g, a, b, bend);
  }

  for (const e of edges) {
    const a = nodeMap.get(e.source), b = nodeMap.get(e.target);
    if (!(a.tier === "spine" && b.tier === "spine")) continue;
    const eqMatch = (mode === "all") || (a.in_equal_mass && b.in_equal_mass);
    const dim = (!eqMatch) || (hovered && !(activeSet.has(a.id) && activeSet.has(b.id)));
    const bend = 0.08 * (a.x < b.x ? 1 : -1);

    g.lineWidth = dim ? 2.0 : 12.0;
    g.strokeStyle = dim ? "rgba(200, 60, 190, 0.06)" : "rgba(235, 55, 225, 0.14)";
    drawEdgeCurve(g, a, b, bend);

    g.lineWidth = dim ? 1.2 : 5.0;
    g.strokeStyle = dim ? "rgba(240, 110, 220, 0.12)" : "rgba(255, 115, 235, 0.36)";
    drawEdgeCurve(g, a, b, bend);

    g.lineWidth = dim ? 0.7 : 1.8;
    g.strokeStyle = dim ? "rgba(255, 210, 250, 0.18)" : "rgba(255, 244, 255, 0.85)";
    drawEdgeCurve(g, a, b, bend);
  }

  if (spineNodes.length > 1) {
    const activeSpine = mode === "all" ? spineNodes : spineNodes.filter(n => n.in_equal_mass);
    if (activeSpine.length > 1) {
      g.beginPath();
      g.moveTo(activeSpine[0].x, activeSpine[0].y);
      for (let i = 1; i < activeSpine.length; i++) {
        const p0 = activeSpine[i - 1], p1 = activeSpine[i];
        g.quadraticCurveTo(p0.x, (p0.y + p1.y) * 0.5, p1.x, p1.y);
      }
      g.lineWidth = 22;
      g.strokeStyle = "rgba(220, 50, 230, 0.10)";
      g.stroke();
      g.lineWidth = 7;
      g.strokeStyle = "rgba(255, 130, 240, 0.22)";
      g.stroke();
      g.lineWidth = 2;
      g.strokeStyle = "rgba(255, 248, 255, 0.55)";
      g.stroke();
    }
  }

  for (const n of branchNodes) {
    const eqMatch = (mode === "all") || n.in_equal_mass;
    const dim = (!eqMatch) || (hovered && !activeSet.has(n.id));
    const grad = g.createRadialGradient(n.x, n.y, 0.5, n.x, n.y, n.r * 4.2);
    if (n.kind === "python") {
      grad.addColorStop(0, dim ? "rgba(180,140,255,0.22)" : "rgba(235, 210, 255, 0.95)");
      grad.addColorStop(0.4, dim ? "rgba(130,80,220,0.08)" : "rgba(175, 95, 255, 0.45)");
      grad.addColorStop(1, "rgba(120, 40, 220, 0)");
    } else {
      grad.addColorStop(0, dim ? "rgba(190,110,240,0.18)" : "rgba(245, 185, 255, 0.88)");
      grad.addColorStop(0.4, dim ? "rgba(150,55,220,0.07)" : "rgba(190, 65, 255, 0.38)");
      grad.addColorStop(1, "rgba(140, 30, 220, 0)");
    }
    g.fillStyle = grad;
    g.beginPath();
    g.arc(n.x, n.y, n.r * 4.2, 0, Math.PI * 2);
    g.fill();
  }

  for (const n of spineNodes) {
    const eqMatch = (mode === "all") || n.in_equal_mass;
    const dim = (!eqMatch) || (hovered && !activeSet.has(n.id));
    const halo = n.main_depth === 0 ? 52 : n.r * 5.2;
    const grad = g.createRadialGradient(n.x, n.y, 1, n.x, n.y, halo);
    grad.addColorStop(0, dim ? "rgba(255,210,250,0.25)" : "rgba(255, 255, 255, 1.0)");
    grad.addColorStop(0.25, dim ? "rgba(240,95,220,0.12)" : "rgba(255, 120, 238, 0.72)");
    grad.addColorStop(0.6, dim ? "rgba(180,45,220,0.04)" : "rgba(205, 50, 255, 0.20)");
    grad.addColorStop(1, "rgba(160, 20, 255, 0)");
    g.fillStyle = grad;
    g.beginPath();
    g.arc(n.x, n.y, halo, 0, Math.PI * 2);
    g.fill();
  }

  g.globalCompositeOperation = "source-over";
  if (showLabels) {
    g.font = "500 17px ui-monospace, SFMono-Regular, Menlo, monospace";
    const leftItems = [], rightItems = [];
    CALLOUT_IDS.forEach((id, idx) => {
      const n = nodeMap.get(id);
      if (!n) return;
      if (mode === "eq" && !n.in_equal_mass) return;
      if (n.x < 0 || (Math.abs(n.x) < 25 && idx % 2 === 0)) leftItems.push(n);
      else rightItems.push(n);
    });
    const layoutColumn = (items, sideX, align) => {
      items.sort((a, b) => a.y - b.y);
      let lastY = -1080;
      for (const n of items) {
        const ly = Math.max(n.y, lastY + 46);
        lastY = ly;
        const label = n.short_label;
        g.strokeStyle = "rgba(230, 180, 255, 0.28)";
        g.lineWidth = 1.1;
        g.beginPath();
        g.moveTo(n.x, n.y);
        g.lineTo(sideX + (align === "left" ? 12 : -12), ly);
        g.stroke();

        g.fillStyle = n.tier === "spine" ? "rgba(255, 232, 252, 0.92)" : "rgba(210, 185, 245, 0.78)";
        g.textAlign = align;
        g.textBaseline = "middle";
        g.fillText(label, sideX, ly);
      }
    };
    layoutColumn(leftItems, -820, "left");
    layoutColumn(rightItems, 820, "right");
  }

  if (isExport) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = "rgba(230, 210, 248, 0.72)";
    g.font = "500 26px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.textAlign = "left";
    g.fillText("SAARI'S CONJECTURE (PLANAR N=4) — PROOF DEPENDENCY GRAPH", 70, H - 145);
    g.fillStyle = "rgba(180, 165, 205, 0.65)";
    g.font = "400 21px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.fillText(
      `trunk = ${stats.tiers.spine.count} core sections (${stats.tiers.spine.tex_lines.toLocaleString()} lines)   ·   ` +
      `branches = ${stats.tiers.branch.count} lemmas & verifiers   ·   ` +
      `dust = ${stats.tiers.dust.count} exploratory derivations`,
      70, H - 102
    );
  }

  g.restore();
}

let dragging = false, dragStart = { x: 0, y: 0 };

function screenToWorld(sx, sy) {
  return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
}

canvas.addEventListener("mousedown", e => {
  dragging = true;
  dragStart = { x: e.clientX - view.x, y: e.clientY - view.y };
});
window.addEventListener("mouseup", () => { dragging = false; });

const tooltip = document.getElementById("tooltip");
canvas.addEventListener("mousemove", e => {
  if (dragging) {
    view.x = e.clientX - dragStart.x;
    view.y = e.clientY - dragStart.y;
    draw(ctx, window.innerWidth, window.innerHeight, view);
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);
  let best = null, bestD = 22 / view.scale;
  for (const n of nodes) {
    if (!showDust && n.tier === "dust") continue;
    const d = Math.hypot(n.x - w.x, n.y - w.y);
    if (d < bestD) { bestD = d; best = n; }
  }
  if (best !== hovered) {
    hovered = best;
    draw(ctx, window.innerWidth, window.innerHeight, view);
  }
  if (hovered) {
    tooltip.style.display = "block";
    tooltip.style.left = Math.min(window.innerWidth - 360, e.clientX + 16) + "px";
    tooltip.style.top = Math.min(window.innerHeight - 130, e.clientY + 14) + "px";
    tooltip.innerHTML =
      `<div class="t-title">${hovered.title}</div>` +
      `<div class="t-meta">tier: ${hovered.tier.toUpperCase()} · type: ${hovered.kind} · ${hovered.line_count} lines</div>` +
      `<div class="t-sub">id: ${hovered.id}<br/>cited by: ${hovered.in_degree} · depends on: ${hovered.out_degree}` +
      (hovered.start_line ? ` · ${hovered.file}:${hovered.start_line}–${hovered.end_line}` : "") +
      `</div>`;
  } else {
    tooltip.style.display = "none";
  }
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const mx = e.clientX, my = e.clientY;
  view.x = mx - (mx - view.x) * factor;
  view.y = my - (my - view.y) * factor;
  view.scale = Math.max(0.15, Math.min(6.0, view.scale * factor));
  draw(ctx, window.innerWidth, window.innerHeight, view);
}, { passive: false });

document.getElementById("btn-all").onclick = (e) => {
  mode = "all";
  e.target.classList.add("active");
  document.getElementById("btn-eq").classList.remove("active");
  draw(ctx, window.innerWidth, window.innerHeight, view);
};
document.getElementById("btn-eq").onclick = (e) => {
  mode = "eq";
  e.target.classList.add("active");
  document.getElementById("btn-all").classList.remove("active");
  draw(ctx, window.innerWidth, window.innerHeight, view);
};
document.getElementById("btn-dust").onclick = (e) => {
  showDust = !showDust;
  e.target.classList.toggle("active", showDust);
  draw(ctx, window.innerWidth, window.innerHeight, view);
};
document.getElementById("btn-labels").onclick = (e) => {
  showLabels = !showLabels;
  e.target.classList.toggle("active", showLabels);
  draw(ctx, window.innerWidth, window.innerHeight, view);
};
document.getElementById("btn-reset").onclick = () => {
  resetView();
  draw(ctx, window.innerWidth, window.innerHeight, view);
};
document.getElementById("btn-export").onclick = () => {
  const EW = 2400, EH = 3600;
  const off = document.createElement("canvas");
  off.width = EW; off.height = EH;
  const og = off.getContext("2d");
  const ev = { x: EW / 2, y: EH * 0.485, scale: 1.38 };
  const prevHover = hovered;
  hovered = null;
  draw(og, EW, EH, ev, true);
  hovered = prevHover;
  const a = document.createElement("a");
  a.download = mode === "eq" ? "saari_equal_mass_dependency_graph_4k.png" : "saari_dependency_graph_4k.png";
  a.href = off.toDataURL("image/png");
  a.click();
};

resize();
</script>
